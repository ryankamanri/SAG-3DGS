re10k:
  name: re10k
  weight: 0.75
  view_sampler: interval
  roots: [datasets/re10k]
  make_baseline_1: false
  augment: true

  image_shape: [256, 256]
  background_color: [0.0, 0.0, 0.0]
  cameras_are_circular: false
  overfit_to_scene: null

  baseline_epsilon: 1e-3
  max_fov: 100.0

  skip_bad_shape: false
  near: -1.
  far: -1.
  baseline_scale_bounds: false
  shuffle_val: true
  train_times_per_scene: 1
  test_len: -1
  test_chunk_interval: 1
  test_times_per_scene: 4

  depth_map_path: path_to_depth_map
  offline: false