# @package _global_

defaults:
  - override /dataset: [re10k]
  - override /model/encoder: [incremental]
  - override /loss: [mse, lpips, depth]

wandb:
  name: acid
  tags: [acid, 256x256]

data_loader:
  train:
    batch_size: 14

trainer:
  max_steps: 300_001

# ----- Additional params for default best model customization
model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]


dataset: 
  re10k:
    name: acid # we explicit set the dataset name to avoid confusion in dataloader
    roots: [datasets/acid]
    test_times_per_scene: 1
  view_sampler:
    evaluation:
      index_path: assets/evaluation_index_acid_insert1.json

test:
  eval_time_skip_steps: 5
  compute_scores: true
